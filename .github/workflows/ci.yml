name: CI

# Every job runs without a repository secret. The workflow only reads the checkout and the
# public network (for the citation link check), and declares the minimum token permission it
# needs. Actions are referenced by major version tag; pinning to commit SHAs is the follow-up
# hardening step recorded in docs/knowledge-update-process.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor declared in engines; 24 is what the DeepSeek Harness runtime ships.
        node: [22.x, 24.x]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install development tooling
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: No runtime dependencies
        run: |
          node -e "
            const manifest = require('./package.json');
            const runtime = Object.keys(manifest.dependencies ?? {});
            if (runtime.length > 0) {
              console.error('Runtime dependencies are forbidden:', runtime.join(', '));
              process.exit(1);
            }
            console.log('runtime dependencies: none');
          "

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Syntax check
        run: npm run check:syntax

      - name: Generated client bundle is current
        run: npm run build:check

      - name: Generated rule reference is current
        run: npm run docs:rules:check

      - name: No credential-shaped strings
        run: npm run check:secrets

      - name: Licence and dependency policy
        run: npm run check:licenses

      - name: Verifier (without the network check; the suite already ran)
        run: node scripts/verify.mjs --offline

  citations:
    name: Citation links resolve
    runs-on: ubuntu-latest
    # Separate job so a transient network failure cannot fail the code checks, and vice versa.
    continue-on-error: false
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Check every cited URL
        run: node scripts/check-links.mjs
